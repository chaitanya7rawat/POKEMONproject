<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pokemon App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-cover bg-center min-h-screen" style="background-image: url('./background1.jpg')">

  <!-- App Title -->
  <h1 class="text-4xl font-bold text-center mt-8 text-white drop-shadow-lg">Pokemon App</h1>

  <!-- Login Section -->
  <div id="login-section" class="flex items-center justify-center h-screen">
    <div class="bg-white bg-opacity-80 backdrop-blur-sm shadow-lg p-8 rounded-lg w-80 text-center">
      <h2 class="text-2xl font-bold mb-4">Login</h2>
      <input id="username" value="ash" placeholder="Username" class="mb-3 p-2 w-full border rounded" />
      <input id="password" type="password" value="pikachu" placeholder="Password" class="mb-3 p-2 w-full border rounded" />
      <div class="mb-3 text-left">
        <input type="checkbox" id="rememberMe" class="mr-1"> Remember Me
      </div>
      <button onclick="login()" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded w-full">Login</button>
      <p id="login-error" class="text-red-500 mt-3 text-sm"></p>
    </div>
  </div>

  <!-- App Section -->
  <div id="app" class="hidden p-6 text-gray-800">

    <!-- User Box Top Left -->
    <div id="userBox" class="absolute top-4 left-4 bg-white bg-opacity-80 p-3 rounded shadow cursor-pointer">
      <span id="usernameDisplay" class="font-bold"></span>
      <div id="userDropdown" class="hidden mt-2 bg-white p-2 rounded shadow">
        <div><strong>User:</strong> <span id="userInfoName"></span></div>
        <button onclick="logout()" class="mt-2 bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-sm w-full">Logout</button>
      </div>
    </div>

    <!-- Welcome Message -->
    <h2 class="text-2xl font-bold text-center mb-6">Welcome, <span id="user-name"></span>!</h2>

    <!-- Grids -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

      <!-- Pokemon List -->
      <div>
        <h3 class="text-xl font-semibold mb-2">Pokemon List</h3>
        <ul id="pokemon-list" class="space-y-2"></ul>
      </div>

      <!-- Favorite List -->
      <div>
        <h3 class="text-xl font-semibold mb-2">Favorite Pokemons</h3>
        <ul id="favorites-list" class="space-y-2"></ul>
      </div>

      <!-- Timeline -->
      <div>
        <h3 class="text-xl font-semibold mb-2">Activity Timeline</h3>
        <ul id="timeline-log" class="space-y-1 text-sm"></ul>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
